<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Donation Platform</title><style>body{font-family:Inter,Arial;max-width:900px;margin:40px auto;padding:20px;background:#f7f7fb}.panel{background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 30px #0001}input,select,button{padding:12px;margin:6px;border:1px solid #ddd;border-radius:10px}button{cursor:pointer}.list{margin-top:20px}</style></head><body><div class="panel"><h1>Blood Donation Platform</h1><p>Find available donors by blood group and city.</p><select id="bg"><option value="">Any group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="city" placeholder="City"><button onclick="find()">Find donors</button><div id="out" class="list"></div></div><script>async function find(){let q=new URLSearchParams();if(bg.value)q.set('blood_group',bg.value);if(city.value)q.set('city',city.value);let x=await(await fetch('/donors?'+q)).json();out.innerHTML=x.length?x.map(d=>'<p><b>'+d.name+'</b> · '+d.blood_group+' · '+d.city+'</p>').join(''):'No available donors found.'}</script></body></html>
